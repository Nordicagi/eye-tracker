<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyes">
<meta name="theme-color" content="#050506">
<title>Watching Eyes</title>
<style>
  :root {
    --ground: #050506;
    --sclera: #efe6d8;
    --sclera-rim: #b9544c;
    --vein: #8e1418;
    --iris: #a9c0c4;
    --iris-dark: #2c4046;
    --pupil: #020203;
    --bone: #e4dcc6;
    --edge: #0c0d11;
    --scope: #14161b;
    --scope-hi: #343944;
    --glass: rgba(90, 210, 195, .14);
    --text: #d9d5cb;
    --text-dim: #7d8290;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* iOS only keeps decoding frames for a video that is technically on screen */
  video { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 10px;
    padding: 16px calc(24px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
    text-align: center;
    background: linear-gradient(to top, rgba(5, 5, 6, .94) 18%, rgba(5, 5, 6, 0) 45%);
  }
  #start[hidden] { display: none; }
  #start p { margin: 0; max-width: 46ch; color: var(--text-dim); font-size: 13px; }
  button {
    font: inherit; font-weight: 600;
    color: var(--ground); background: var(--sclera);
    border: 0; border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--iris); outline-offset: 3px; }
  #status {
    position: fixed; left: 0; right: 0;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12px; letter-spacing: .04em;
    color: var(--text-dim);
    pointer-events: none;
    transition: opacity .8s;
  }
  #status.quiet { opacity: 0; }
  body.running { cursor: none; }
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="start">
  <button id="go" type="button">Start the eyes</button>
  <p>You will be asked to allow the camera. The picture stays on this device. Nothing is recorded or sent anywhere.</p>
  <p id="hint"></p>
</div>
<div id="status" aria-live="polite"></div>

<script>
const MP_VERSION = "0.10.14";
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const video = document.getElementById("cam");
const startPanel = document.getElementById("start");
const statusEl = document.getElementById("status");
const css = getComputedStyle(document.documentElement);
const C = {};
for (const [key, name] of Object.entries({
  ground: "--ground", sclera: "--sclera", scleraRim: "--sclera-rim", vein: "--vein",
  iris: "--iris", irisDark: "--iris-dark", pupil: "--pupil", bone: "--bone", edge: "--edge",
  scope: "--scope", scopeHi: "--scope-hi", glass: "--glass",
})) C[key] = css.getPropertyValue(name).trim();

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

// Gaze runs from -1 to 1 on each axis. "near" is how close the watched face is, 0 to 1.
// The two eyes are driven separately so one trails the other by a hair.
const gaze = { x: 0, y: 0, near: 0.3 };
const gazeB = { x: 0, y: 0 };
const target = { x: 0, y: 0, near: 0.3 };
const jitter = { x: 0, y: 0, next: 0 };
const blink = { start: -1, next: 2500, duration: 110 };
const idle = { next: 0 };
let scope = 0;            // 0 = binoculars away, 1 = held up to the eyes
let scopeWanted = false;
let lastFaceAt = -Infinity;
let lastFace = null;
let detector = null;
let W = 0, H = 0, DPR = 1;

// Messages show for a few seconds, then fade so only the eyes are left.
let statusTimer = 0;
function setStatus(text) {
  if (statusEl.textContent === text) return;
  statusEl.textContent = text;
  statusEl.classList.remove("quiet");
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.add("quiet"), 3500);
}

// Full screen. iPhone Safari only hides its bars for a page opened from the Home Screen.
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const canFullscreen = !!document.documentElement.requestFullscreen;
document.getElementById("hint").textContent =
  isIOS && !navigator.standalone ? "For full screen with no Safari bars: tap Share, then Add to Home Screen, and open it from the new icon."
  : canFullscreen ? "Double-tap or double-click the eyes for full screen."
  : "";
function toggleFullscreen() {
  if (!canFullscreen) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}
let lastTap = 0;
canvas.addEventListener("pointerup", e => {
  if (e.timeStamp - lastTap < 350) { toggleFullscreen(); lastTap = 0; }
  else lastTap = e.timeStamp;
});

// ---------- Face tracking ----------

// Sizes are a face's height as a share of the picture height.
const OWNER_SIZE = 0.2;   // the biggest face at least this large is the person holding the phone: ignored
const FAR_SIZE = 0.14;    // smaller than this counts as far away: binoculars
const FAR_MEMORY_MS = 2600;
const DETECT_GAP_MS = 30;
const WORK_WIDTH = 320;   // the detector only looks at a tiny picture, so feed it a small one

// Distant faces vanish when the whole frame is shrunk for the detector.
// To find them, the frame is also searched in zoomed-in pieces: 2x zoom and 3x zoom.
const tiles = [];
for (const y of [0, 0.25, 0.5]) for (const x of [0, 0.25, 0.5]) tiles.push({ x, y, s: 0.5 });
for (const y of [0, 0.22, 0.44, 0.66]) for (const x of [0, 0.22, 0.44, 0.66]) tiles.push({ x, y, s: 0.34 });
const work = document.createElement("canvas");
const workCtx = work.getContext("2d", { willReadFrequently: true });
let step = 0;
let tileIndex = 0;
let wholeFaces = [];
let farMemory = [];
let owner = null;
const peek = { until: 0, next: 0 };

// Runs the detector on one region of the camera picture. x, y, s are shares of the frame.
function detectRegion(x, y, s, minScore) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const wh = Math.round(WORK_WIDTH * vh / vw);
  if (work.width !== WORK_WIDTH || work.height !== wh) { work.width = WORK_WIDTH; work.height = wh; }
  workCtx.drawImage(video, x * vw, y * vh, s * vw, s * vh, 0, 0, WORK_WIDTH, wh);
  const out = [];
  for (const d of detector.detect(work).detections || []) {
    const b = d.boundingBox;
    if (!b) continue;
    const score = d.categories && d.categories[0] ? d.categories[0].score : 1;
    if (score < minScore) continue;
    const face = {
      cx: x + (b.originX + b.width / 2) / WORK_WIDTH * s,
      cy: y + (b.originY + b.height / 2) / wh * s,
      size: b.height / wh * s,
      yaw: 1, roll: 0,
    };
    // Landmarks: 0 and 1 are the eyes, 2 the nose tip, 4 and 5 the ears.
    const p = d.keypoints;
    if (p && p.length >= 6) {
      const earGap = Math.abs(p[5].x - p[4].x);
      // Nose centred between the ears means the head is turned toward the camera.
      if (earGap > 0.001) face.yaw = (p[2].x - (p[4].x + p[5].x) / 2) / earGap;
      face.roll = Math.atan2((p[1].y - p[0].y) * wh, (p[1].x - p[0].x) * WORK_WIDTH);
    }
    out.push(face);
  }
  return out;
}

// ---------- Reactions ----------

// What the eyes do in response to the person they are watching.
const react = {
  facing: 0,        // 0 to 1, how sure it is that the person is looking back
  facingSince: 0,
  notice: 0,        // jumps to 1 the moment someone looks at it, then fades
  startle: 0,       // jumps to 1 when someone rushes closer, then fades
  startleReady: 0,
  stare: 0,         // rises while someone looks back at it
  sizeSlow: 0,
  tilt: 0, tiltWanted: 0,
  searchUntil: 0,   // just lost someone: hunt for them
};

function observe(face, sameTarget, now) {
  if (!sameTarget) {
    react.facing = 0;
    react.facingSince = 0;
    react.sizeSlow = face.size;
  }
  const wasFacing = react.facing > 0.6;
  react.facing += ((Math.abs(face.yaw) < 0.18 ? 1 : 0) - react.facing) * 0.12;
  const isFacing = react.facing > 0.6;

  if (isFacing && !wasFacing) {
    react.facingSince = now;
    // They looked straight at it. Let them know it noticed.
    react.notice = 1;
  }
  if (!isFacing) react.facingSince = 0;

  // Someone suddenly much closer than a moment ago.
  if (face.size > react.sizeSlow * 1.35 && now > react.startleReady) {
    react.startle = 1;
    react.startleReady = now + 3000;
  }
  react.sizeSlow += (face.size - react.sizeSlow) * 0.04;

  // Copy the tilt of their head.
  react.tiltWanted = clamp(-face.roll * 0.7, -0.3, 0.3);
}

function scanTile(index, now) {
  const t = tiles[index];
  const found = detectRegion(t.x, t.y, t.s, 0.7);
  farMemory = farMemory.filter(f => f.tile !== index);
  for (const f of found) { f.tile = index; f.t = now; farMemory.push(f); }
}

// Keeps following the same person unless someone else is clearly bigger in view.
function pickFace(faces) {
  let best = null, bestScore = 0;
  for (const f of faces) {
    let score = f.size * f.size;
    if (lastFace && Math.hypot(f.cx - lastFace.cx, f.cy - lastFace.cy) < 0.15) score *= 1.4;
    if (score > bestScore) { bestScore = score; best = f; }
  }
  return best;
}

let lastDetectAt = 0;
function detect(now) {
  if (!detector || video.readyState < 2 || !video.videoWidth) return;
  if (now - lastDetectAt < DETECT_GAP_MS) return;
  lastDetectAt = now;

  // One detector run per screen frame keeps the animation smooth:
  // whole picture, then two zoomed pieces, and repeat.
  try {
    if (step % 3 === 0) {
      wholeFaces = detectRegion(0, 0, 1, 0.5);
    } else if (step % 3 === 1 && lastFace && lastFace.tile !== undefined) {
      scanTile(lastFace.tile, now);   // keep a close watch on the piece holding the current target
    } else {
      scanTile(tileIndex, now);
      tileIndex = (tileIndex + 1) % tiles.length;
    }
  } catch { return; }
  step++;

  // Merge: drop zoomed finds that are stale or are a face the whole-picture pass already has.
  farMemory = farMemory.filter(f => now - f.t < FAR_MEMORY_MS);
  const faces = wholeFaces.slice();
  for (const f of farMemory) {
    if (!faces.some(g => Math.hypot(g.cx - f.cx, g.cy - f.cy) < Math.max(0.06, g.size * 0.6))) faces.push(f);
  }

  // The closest face is the person holding the phone. Leave them out.
  let own = null, ownScore = 0;
  for (const f of faces) {
    if (f.size < OWNER_SIZE) continue;
    let score = f.size;
    if (owner && Math.hypot(f.cx - owner.cx, f.cy - owner.cy) < 0.15) score *= 1.3;
    if (score > ownScore) { ownScore = score; own = f; }
  }
  owner = own;
  const others = faces.filter(f => f !== own);

  const near = others.filter(f => f.size >= FAR_SIZE);
  const far = others.filter(f => f.size < FAR_SIZE);
  let face = null, usingScope = false;
  if (near.length && far.length) {
    // Mostly watch whoever is closer, but check on the people further back now and then.
    // Never break off a stare-down to peek at someone else.
    if (react.stare > 0.3 && now > peek.until) peek.next = Math.max(peek.next, now + 2000);
    if (now > peek.next) { peek.until = now + rand(2800, 4200); peek.next = peek.until + rand(7000, 13000); }
    usingScope = now < peek.until;
    face = pickFace(usingScope ? far : near);
  } else if (far.length) {
    face = pickFace(far);
    usingScope = true;
  } else if (near.length) {
    face = pickFace(near);
  }
  scopeWanted = usingScope;

  if (!face) {
    if (lastFace) react.searchUntil = now + 4000;
    lastFace = null;
    if (own) setStatus("Ignoring you. Looking for other people.");
    return;
  }
  observe(face, !!lastFace && Math.hypot(face.cx - lastFace.cx, face.cy - lastFace.cy) < 0.15, now);
  lastFace = face;
  lastFaceAt = now;
  // The front camera sees you un-mirrored, so a face on the picture's left is on the screen's right.
  target.x = clamp((0.5 - face.cx) * 2 * 1.5, -1, 1);
  target.y = clamp((face.cy - 0.5) * 2 * 1.5, -1, 1);
  target.near = usingScope ? 0 : clamp((face.size - 0.1) / 0.4, 0, 1);
  setStatus(usingScope ? "Watching someone far away" : others.length > 1 ? `Watching 1 of ${others.length} people` : "Watching someone");
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  // Where the camera lets a page set zoom, pull it all the way out for the widest view.
  try {
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.zoom && typeof caps.zoom.min === "number") await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
  } catch { /* zoom control is optional */ }
  video.srcObject = stream;
  await video.play();
}

async function startDetector() {
  const { FaceDetector, FilesetResolver } = await import(`${MP_BASE}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  detector = await FaceDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
    runningMode: "IMAGE",
    minDetectionConfidence: 0.5,
  });
}

async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch { /* the phone may refuse, e.g. in low power mode */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && startPanel.hidden) keepAwake();
});

document.getElementById("go").addEventListener("click", async () => {
  startPanel.hidden = true;
  document.body.classList.add("running");
  keepAwake();
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("No camera here. Open this page over https. The eyes follow your finger for now.");
    return;
  }
  setStatus("Waiting for the camera");
  try {
    await startCamera();
  } catch {
    setStatus("Camera is off. The eyes follow your finger instead.");
    return;
  }
  setStatus("Loading face tracking");
  try {
    await startDetector();
    setStatus("Looking for people");
  } catch {
    setStatus("Face tracking could not load. Check the internet connection and reload.");
  }
});

// Finger or mouse steers the eyes when there is no face to follow.
function pointTo(e) {
  if (performance.now() - lastFaceAt < 800) return;
  target.x = clamp((e.clientX / W - 0.5) * 2.4, -1, 1);
  target.y = clamp((e.clientY / H - 0.5) * 2.4, -1, 1);
  target.near = 0.5;
  idle.next = performance.now() + 2500;
}
canvas.addEventListener("pointermove", pointTo);
canvas.addEventListener("pointerdown", pointTo);

// ---------- Drawing ----------

// The bloodshot white of each eye is painted once and reused every frame.
let sprites = [];
let spriteR = 0;

function mulberry(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function vein(g, rnd, x, y, angle, length, width, depth) {
  const steps = 7;
  g.lineCap = "round";
  for (let i = 0; i < steps; i++) {
    angle += (rnd() - 0.5) * 0.7;
    const nx = x + Math.cos(angle) * length / steps;
    const ny = y + Math.sin(angle) * length / steps;
    g.lineWidth = Math.max(0.6, width * (1 - i / steps));
    g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke();
    x = nx; y = ny;
    if (depth > 0 && rnd() < 0.3) vein(g, rnd, x, y, angle + (rnd() < 0.5 ? 0.7 : -0.7), length * 0.5, width * 0.6, depth - 1);
  }
}

function buildSprite(r, seed) {
  const S = Math.ceil(r * 1.5 * DPR);
  const c = document.createElement("canvas");
  c.width = c.height = S * 2;
  const g = c.getContext("2d");
  const rnd = mulberry(seed);
  const R = S;
  const white = g.createRadialGradient(S, S, R * 0.25, S, S, R);
  white.addColorStop(0, C.sclera);
  white.addColorStop(0.55, C.sclera);
  white.addColorStop(1, C.scleraRim);
  g.fillStyle = white;
  g.fillRect(0, 0, S * 2, S * 2);
  g.strokeStyle = C.vein;
  g.globalAlpha = 0.7;
  const count = 34;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + rnd() * 0.2;
    const start = R * (0.92 + rnd() * 0.08);
    vein(g, rnd, S + Math.cos(a) * start, S + Math.sin(a) * start, a + Math.PI, R * (0.35 + rnd() * 0.4), R * 0.022, 2);
  }
  return c;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  spriteR = 0;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 250));
resize();

function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
}

function drawEye(cx, cy, r, side, closed, g, sprite) {
  // Eyes turn slightly inward for a close face.
  const gx = clamp(g.x - side * gaze.near * 0.16, -1, 1);
  const gy = g.y;
  const reach = r * 0.44;
  const len = Math.hypot(gx, gy);
  const scale = len > 1 ? 1 / len : 1;
  const ox = gx * scale * reach, oy = gy * scale * reach;
  const ix = cx + ox, iy = cy + oy;
  // A small iris with white showing all round is what makes a stare unsettling.
  const irisR = r * 0.4;
  // Pupils shrink to pinpoints on a fright and swell during a stare-down.
  const pupilR = irisR * clamp(0.26 + gaze.near * 0.4 + react.stare * 0.35 - react.startle * 0.2, 0.12, 0.82);

  ctx.save();
  circle(cx, cy, r);
  ctx.clip();

  // The veined white turns with the eyeball.
  const S = r * 1.5;
  ctx.drawImage(sprite, ix - S, iy - S, S * 2, S * 2);

  const iris = ctx.createRadialGradient(ix, iy, pupilR * 0.6, ix, iy, irisR);
  iris.addColorStop(0, C.iris);
  iris.addColorStop(0.78, C.irisDark);
  iris.addColorStop(1, C.pupil);
  ctx.fillStyle = iris;
  circle(ix, iy, irisR); ctx.fill();

  ctx.fillStyle = C.pupil;
  circle(ix, iy, pupilR); ctx.fill();

  // Shading that stays put, so the ball reads as round.
  const shade = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.3, cx, cy, r);
  shade.addColorStop(0, "rgba(0, 0, 0, 0)");
  shade.addColorStop(0.75, "rgba(40, 0, 0, .12)");
  shade.addColorStop(1, "rgba(20, 0, 0, .6)");
  ctx.fillStyle = shade;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  ctx.fillStyle = "rgba(255, 255, 255, .85)";
  circle(ix - irisR * 0.4, iy - irisR * 0.45, irisR * 0.13); ctx.fill();

  // No eyelids. A blink is the eye snapping shut into the dark.
  if (closed > 0.01) {
    ctx.fillStyle = C.ground;
    ctx.fillRect(cx - r, cy - r, r * 2, r * closed * 1.05);
    ctx.fillRect(cx - r, cy + r - r * closed * 1.05, r * 2, r * closed * 1.05);
  }
  ctx.restore();
}

// A bone: dark outline with a pale core.
function bone(x1, y1, x2, y2, w) {
  ctx.lineCap = "round";
  ctx.strokeStyle = C.edge;
  ctx.lineWidth = w * 1.4;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = C.bone;
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// Binoculars held up in bone hands, used when watching someone far away.
function drawBinoculars(midX, midY, r, spread, amount) {
  const ease = amount * amount * (3 - 2 * amount);
  const y = midY + (1 - ease) * H;
  const R = Math.min(spread, r * 1.3), lens = r * 1.04;

  for (const s of [-1, 1]) {
    const cx = midX + s * spread;
    const a = Math.PI / 2 - s * 0.35;
    const hx = cx + Math.cos(a) * R * 1.3, hy = y + Math.sin(a) * R * 1.3;
    bone(hx, hy, hx + s * R * 0.35, hy + H, r * 0.16);
    bone(hx + s * r * 0.3, hy + r * 0.05, hx + s * R * 0.65, hy + H, r * 0.12);
  }

  ctx.fillStyle = C.scope;
  ctx.strokeStyle = C.scopeHi;
  ctx.lineWidth = r * 0.04;
  ctx.beginPath();
  ctx.rect(midX - spread + lens, y - r * 0.25, 2 * (spread - lens), r * 0.5);
  ctx.fill(); ctx.stroke();
  for (const s of [-1, 1]) {
    const cx = midX + s * spread;
    ctx.strokeStyle = C.scope;
    ctx.lineWidth = R - lens;
    circle(cx, y, (R + lens) / 2); ctx.stroke();
    ctx.strokeStyle = C.scopeHi;
    ctx.lineWidth = r * 0.04;
    circle(cx, y, lens); ctx.stroke();
    circle(cx, y, R); ctx.stroke();
    ctx.fillStyle = C.glass;
    circle(cx, y, lens); ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, .3)";
    ctx.lineWidth = r * 0.05;
    ctx.beginPath();
    ctx.arc(cx, y, lens * 0.82, Math.PI * 1.1, Math.PI * 1.45);
    ctx.stroke();
  }

  // Finger bones gripping each barrel from underneath
  for (const s of [-1, 1]) {
    const cx = midX + s * spread;
    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 2 - s * 0.35 + (i - 1.5) * 0.3;
      const cos = Math.cos(a), sin = Math.sin(a);
      const stops = [1.3, 1.12, 0.97, 0.85];
      for (let j = 0; j < 3; j++) {
        bone(cx + cos * R * stops[j], y + sin * R * stops[j], cx + cos * R * (stops[j + 1] + 0.04), y + sin * R * (stops[j + 1] + 0.04), r * (0.12 - j * 0.015));
      }
    }
  }
}

function draw(now) {
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, 0, W, H);

  // Sized so the eyes and the binoculars fit both upright and sideways.
  const base = Math.min(W * 0.19, H * 0.3);
  if (base <= 0) return;   // page is hidden or has no size yet
  const spread = Math.max(W * 0.25, base * 1.15);
  if (base !== spriteR) { sprites = [buildSprite(base, 7), buildSprite(base, 91)]; spriteR = base; }
  const closed = blinkAmount(now);
  // Eyes bulge on a fright, flare when someone looks at them, and stay wide while stared at.
  const r = base * (1 + 0.16 * react.startle + 0.12 * react.notice + 0.1 * react.stare);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(react.tilt);
  ctx.translate(-W / 2, -H / 2);
  drawEye(W / 2 - spread, H / 2, r, -1, closed, gaze, sprites[0]);
  drawEye(W / 2 + spread, H / 2, r, 1, closed, gazeB, sprites[1]);
  if (scope > 0.01) drawBinoculars(W / 2, H / 2, base, spread, scope);
  ctx.restore();
}

// ---------- Animation ----------

function update(now, dt) {
  const sinceFace = now - lastFaceAt;
  if (sinceFace > 600) scopeWanted = false;

  // Nobody to watch: look about the room.
  if (sinceFace > 1200 && now > idle.next) {
    target.x = rand(-0.8, 0.8);
    target.y = rand(-0.4, 0.4);
    target.near = 0.2;
    // Right after losing someone it hunts about quickly, then settles.
    idle.next = now + (now < react.searchUntil ? rand(250, 650) : rand(1200, 3800));
    if (detector && sinceFace > 3000 && !owner) setStatus("Looking for people");
  }

  const watching = sinceFace < 600;
  // Someone looking back gets stared at harder, straight away, for as long as they keep it up.
  const staredAt = watching && react.facingSince > 0;
  react.stare += ((staredAt ? 1 : 0) - react.stare) * (1 - Math.exp(-dt * (staredAt ? 5 : 1.2)));
  react.notice *= Math.exp(-dt * 3);
  react.startle *= Math.exp(-dt * 2.2);
  if (!watching) react.tiltWanted = 0;
  react.tilt += (react.tiltWanted - react.tilt) * (1 - Math.exp(-dt * 5));

  // Small darts while idle. Watching a person, the stare is dead still and it does not blink.
  if (now > jitter.next) {
    jitter.x = rand(-0.03, 0.03);
    jitter.y = rand(-0.02, 0.02);
    jitter.next = now + rand(350, 1600);
  }
  if (watching) {
    jitter.x = jitter.y = 0;
    if (blink.start < 0) blink.next = Math.max(blink.next, now + 900);
  }
  const tx = target.x + jitter.x, ty = target.y + jitter.y;

  const k = 1 - Math.exp(-dt * 24);
  const kB = 1 - Math.exp(-dt * 15);
  gaze.x += (tx - gaze.x) * k;
  gaze.y += (ty - gaze.y) * k;
  gazeB.x += (tx - gazeB.x) * kB;
  gazeB.y += (ty - gazeB.y) * kB;
  gaze.near += (target.near - gaze.near) * (1 - Math.exp(-dt * 4));
  scope += ((scopeWanted ? 1 : 0) - scope) * (1 - Math.exp(-dt * 7));

  // It rarely blinks, and when it does it is fast.
  if (blink.start < 0 && now > blink.next) {
    blink.start = now;
    blink.duration = rand(90, 130);
  }
  if (blink.start >= 0 && now - blink.start > blink.duration) {
    blink.start = -1;
    blink.next = now + rand(4500, 11000);
  }
}

function blinkAmount(now) {
  if (blink.start < 0) return 0;
  return Math.sin(Math.PI * clamp((now - blink.start) / blink.duration, 0, 1));
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min((now - previous) / 1000, 0.1);
  previous = now;
  detect(now);
  update(now, dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
