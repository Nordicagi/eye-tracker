<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyes">
<meta name="theme-color" content="#0b0d12">
<title>Watching Eyes</title>
<style>
  :root {
    --ground: #0b0d12;
    --lid: #161a23;
    --lid-edge: #05060a;
    --sclera: #ffffff;
    --sclera-shade: #dfe3ee;
    --iris: #4a8fe8;
    --iris-dark: #1d3f8f;
    --iris-glow: #8fe3f5;
    --blush: rgba(255, 130, 150, .8);
    --pupil: #050607;
    --text: #d9d5cb;
    --text-dim: #7d8290;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* iOS only keeps decoding frames for a video that is technically on screen */
  video { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 14px;
    padding: 24px 24px calc(40px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background: linear-gradient(to top, rgba(11, 13, 18, .92) 30%, rgba(11, 13, 18, 0) 70%);
  }
  #start[hidden] { display: none; }
  #start p { margin: 0; max-width: 30ch; color: var(--text-dim); font-size: 14px; }
  button {
    font: inherit; font-weight: 600;
    color: var(--ground); background: var(--sclera);
    border: 0; border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--iris); outline-offset: 3px; }
  #status {
    position: fixed; left: 0; right: 0;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12px; letter-spacing: .04em;
    color: var(--text-dim);
    pointer-events: none;
    transition: opacity .6s;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="start">
  <button id="go" type="button">Start the eyes</button>
  <p>You will be asked to allow the camera. The picture stays on this device. Nothing is recorded or sent anywhere.</p>
</div>
<div id="status" aria-live="polite"></div>

<script>
const MP_VERSION = "0.10.14";
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const video = document.getElementById("cam");
const startPanel = document.getElementById("start");
const statusEl = document.getElementById("status");
const css = getComputedStyle(document.documentElement);
const color = name => css.getPropertyValue(name).trim();
const C = {
  ground: color("--ground"), lid: color("--lid"), lidEdge: color("--lid-edge"),
  sclera: color("--sclera"), scleraShade: color("--sclera-shade"),
  iris: color("--iris"), irisDark: color("--iris-dark"), irisGlow: color("--iris-glow"),
  blush: color("--blush"), pupil: color("--pupil"),
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

// Gaze runs from -1 to 1 on each axis. "near" is how close the watched face is, 0 to 1.
const gaze = { x: 0, y: 0, near: 0.3 };
const target = { x: 0, y: 0, near: 0.3 };
const jitter = { x: 0, y: 0, next: 0 };
const blink = { start: -1, next: 1500, duration: 150 };
const idle = { next: 0 };
let lastFaceAt = -Infinity;
let lastFace = null;
let pointerActive = false;
let detector = null;
let lastVideoTime = -1;
let W = 0, H = 0;

function setStatus(text) {
  if (statusEl.textContent !== text) statusEl.textContent = text;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Face tracking ----------

// Keeps following the same person unless someone else is clearly closer.
function pickFace(detections, vw, vh) {
  let best = null, bestScore = 0;
  for (const d of detections) {
    const b = d.boundingBox;
    if (!b) continue;
    const cx = (b.originX + b.width / 2) / vw;
    const cy = (b.originY + b.height / 2) / vh;
    const size = b.height / vh;
    let score = b.width * b.height;
    if (lastFace && Math.hypot(cx - lastFace.cx, cy - lastFace.cy) < 0.15) score *= 1.4;
    if (score > bestScore) { bestScore = score; best = { cx, cy, size }; }
  }
  return best;
}

function detect(now) {
  if (!detector || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let result;
  try { result = detector.detectForVideo(video, now); } catch { return; }
  const faces = result.detections || [];
  const face = pickFace(faces, video.videoWidth, video.videoHeight);
  if (!face) { lastFace = null; return; }
  lastFace = face;
  lastFaceAt = now;
  // The front camera sees you un-mirrored, so a face on the picture's left is on the screen's right.
  target.x = clamp((0.5 - face.cx) * 2 * 1.5, -1, 1);
  target.y = clamp((face.cy - 0.5) * 2 * 1.5, -1, 1);
  target.near = clamp((face.size - 0.12) / 0.5, 0, 1);
  setStatus(faces.length > 1 ? `Watching the nearest of ${faces.length} people` : "");
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
  });
  video.srcObject = stream;
  await video.play();
}

async function startDetector() {
  const { FaceDetector, FilesetResolver } = await import(`${MP_BASE}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  detector = await FaceDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
    runningMode: "VIDEO",
    minDetectionConfidence: 0.5,
  });
}

async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch { /* the phone may refuse, e.g. in low power mode */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && startPanel.hidden) keepAwake();
});

document.getElementById("go").addEventListener("click", async () => {
  startPanel.hidden = true;
  keepAwake();
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("No camera here. Open this page over https. The eyes follow your finger for now.");
    return;
  }
  setStatus("Waiting for the camera");
  try {
    await startCamera();
  } catch {
    setStatus("Camera is off. The eyes follow your finger instead.");
    return;
  }
  setStatus("Loading face tracking");
  try {
    await startDetector();
    setStatus("Looking for a face");
  } catch {
    setStatus("Face tracking could not load. Check the internet connection and reload.");
  }
});

// Finger or mouse steers the eyes when there is no face to follow.
function pointTo(e) {
  pointerActive = true;
  if (performance.now() - lastFaceAt < 800) return;
  target.x = clamp((e.clientX / W - 0.5) * 2.4, -1, 1);
  target.y = clamp((e.clientY / H - 0.5) * 2.4, -1, 1);
  target.near = 0.5;
  idle.next = performance.now() + 2500;
}
canvas.addEventListener("pointermove", pointTo);
canvas.addEventListener("pointerdown", pointTo);

// ---------- Animation ----------

function update(now, dt) {
  const sinceFace = now - lastFaceAt;

  // Nobody around: look about the room.
  if (sinceFace > 1200 && now > idle.next) {
    target.x = rand(-0.7, 0.7);
    target.y = rand(-0.35, 0.35);
    target.near = 0.25;
    idle.next = now + rand(1400, 4200);
    if (detector && sinceFace > 3000) setStatus("Looking for a face");
  }

  // Tiny darts keep a held stare from looking frozen.
  if (now > jitter.next) {
    jitter.x = rand(-0.035, 0.035);
    jitter.y = rand(-0.025, 0.025);
    jitter.next = now + rand(350, 1600);
  }

  const k = 1 - Math.exp(-dt * 14);
  gaze.x += (target.x + jitter.x - gaze.x) * k;
  gaze.y += (target.y + jitter.y - gaze.y) * k;
  gaze.near += (target.near - gaze.near) * (1 - Math.exp(-dt * 4));

  if (blink.start < 0 && now > blink.next) {
    blink.start = now;
    blink.duration = rand(120, 190);
  }
  if (blink.start >= 0 && now - blink.start > blink.duration) {
    blink.start = -1;
    // Now and then, a quick double blink.
    blink.next = now + (Math.random() < 0.15 ? rand(120, 260) : rand(2200, 6500));
  }
}

function blinkAmount(now) {
  if (blink.start < 0) return 0;
  return Math.sin(Math.PI * clamp((now - blink.start) / blink.duration, 0, 1));
}

function drawEye(cx, cy, r, side, closed) {
  // Eyes turn slightly inward for a close face.
  const vergence = -side * gaze.near * 0.18;
  const gx = clamp(gaze.x + vergence, -1, 1);
  const gy = gaze.y;
  // Tall, round eyes with an oversized iris read as young and friendly.
  const rx = r * 0.92, ry = r * 1.06;
  const reach = r * 0.3;
  const len = Math.hypot(gx, gy);
  const scale = len > 1 ? 1 / len : 1;
  const ix = cx + gx * scale * reach;
  const iy = cy + gy * scale * reach + r * 0.04;
  const irisR = r * 0.68;
  // Pupils grow when someone comes close.
  const pupilR = irisR * (0.52 + gaze.near * 0.16);

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.clip();

  const white = ctx.createRadialGradient(cx, cy - r * 0.2, r * 0.3, cx, cy, ry);
  white.addColorStop(0, C.sclera);
  white.addColorStop(1, C.scleraShade);
  ctx.fillStyle = white;
  ctx.fillRect(cx - r * 1.1, cy - r * 1.1, r * 2.2, r * 2.2);

  // Darker at the top, glowing at the bottom.
  const iris = ctx.createLinearGradient(0, iy - irisR, 0, iy + irisR);
  iris.addColorStop(0, C.irisDark);
  iris.addColorStop(0.55, C.iris);
  iris.addColorStop(1, C.irisGlow);
  ctx.fillStyle = iris;
  ctx.beginPath();
  ctx.arc(ix, iy, irisR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = C.irisDark;
  ctx.lineWidth = irisR * 0.09;
  ctx.stroke();

  ctx.fillStyle = C.pupil;
  ctx.beginPath();
  ctx.arc(ix, iy, pupilR, 0, Math.PI * 2);
  ctx.fill();

  // Sparkles: one big, one small opposite it, and a soft glint low in the iris.
  ctx.fillStyle = "rgba(255, 255, 255, .95)";
  ctx.beginPath();
  ctx.arc(ix - irisR * 0.36, iy - irisR * 0.4, irisR * 0.27, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ix + irisR * 0.4, iy + irisR * 0.38, irisR * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255, 255, 255, .28)";
  ctx.beginPath();
  ctx.ellipse(ix, iy + irisR * 0.7, irisR * 0.42, irisR * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Lids. Wide open at rest; the upper one dips a little when looking down.
  const rest = clamp(0.03 + gy * 0.06, 0, 0.14);
  const upper = rest + (1 - rest) * closed * 0.86;
  const lower = -0.06 + closed * 0.22;
  const upperY = cy - ry + 2 * ry * upper;
  const lowerY = cy + ry - 2 * ry * lower;
  ctx.fillStyle = C.lid;
  ctx.strokeStyle = C.lidEdge;
  ctx.lineWidth = Math.max(2, r * 0.035);

  ctx.beginPath();
  ctx.moveTo(cx - r * 1.1, cy - r * 1.1);
  ctx.lineTo(cx + r * 1.1, cy - r * 1.1);
  ctx.lineTo(cx + r * 1.1, upperY - r * 0.12);
  ctx.quadraticCurveTo(cx, upperY + r * 0.12, cx - r * 1.1, upperY - r * 0.12);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx - r * 1.1, cy + r * 1.1);
  ctx.lineTo(cx + r * 1.1, cy + r * 1.1);
  ctx.lineTo(cx + r * 1.1, lowerY + r * 0.1);
  ctx.quadraticCurveTo(cx, lowerY - r * 0.1, cx - r * 1.1, lowerY + r * 0.1);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = C.lidEdge;
  ctx.lineWidth = Math.max(2, r * 0.05);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Blush on the outer cheek.
  const bx = cx + side * r * 0.5, by = cy + ry + r * 0.3;
  const blush = ctx.createRadialGradient(bx, by, 0, bx, by, r * 0.42);
  blush.addColorStop(0, C.blush);
  blush.addColorStop(1, "rgba(255, 130, 150, 0)");
  ctx.fillStyle = blush;
  ctx.save();
  ctx.translate(bx, by);
  ctx.scale(1, 0.55);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
  ctx.restore();
  ctx.fill();
}

function draw(now) {
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, 0, W, H);
  const r = Math.min(W * 0.2, H * 0.32);
  const spread = Math.max(W * 0.25, r * 1.15);
  const closed = blinkAmount(now);
  drawEye(W / 2 - spread, H / 2, r, -1, closed);
  drawEye(W / 2 + spread, H / 2, r, 1, closed);
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min((now - previous) / 1000, 0.1);
  previous = now;
  detect(now);
  update(now, dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
